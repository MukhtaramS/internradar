# Starter company registry for the internship tracker.
# Checked on 2026-11-05.
#
# Fields
#   name        display name (also used as the company key)
#   category    faang | faang_plus | quant | europe_tech
#   enabled     false = keep the entry but skip it when scraping
#   hubs        main European offices (for reference and the location filter)
#   adapter     which scraper handles it (one adapter per careers platform):
#                 greenhouse   GET boards-api.greenhouse.io/v1/boards/{token}/jobs
#                 ashby        GET api.ashbyhq.com/posting-api/job-board/{org}
#                 lever        GET api.lever.co/v0/postings/{org}
#                 workday      POST {host}/wday/cxs/{tenant}/{site}/jobs
#                 eightfold    GET {host}/api/apply/v2/jobs?domain={domain}
#                 eightfold_pcsx  GET {host}/api/pcsx/search?domain={domain}
#                 phenom       POST {host}/widgets
#                 jibe         GET {host}/api/jobs?keywords=intern  (Radancy/iCIMS Jibe sites)
#                 avature      server-rendered HTML at {host}/careers/SearchJobs/{query}
#                 html         server-rendered job list at {url}; needs its own parser
#                 custom       a one-off API; see notes
#                 headless     site blocks plain HTTP clients; needs Playwright
#                 unknown      not researched far enough yet
#   status      how sure we are that the adapter works:
#                 verified    probed on 2026-11-05 and returned live jobs (count in notes)
#                 from_fit    copied from FaangInternTracker's working scraper config
#                 seen_on_ti  tech-internships.eu lists jobs from it, so it can be done
#                 research    still needs work before it can be scraped
#   notes       anything worth knowing before writing or debugging the adapter

companies:

  # ---------------------------------------------------------------- FAANG ----

  - name: Google
    category: faang
    hubs: [London, Zurich, Munich, Dublin, Warsaw]
    adapter: custom
    url: https://www.google.com/about/careers/applications/jobs/results
    params: {q: intern, employment_type: INTERN}
    status: from_fit
    notes: Parse the AF_initDataCallback 'ds:1' JSON embedded in the HTML. Positional arrays; job[12][0] is the publish timestamp.

  - name: Meta
    category: faang
    hubs: [London, Dublin, Paris, Zurich]
    adapter: custom
    url: https://www.metacareers.com/graphql
    params: {doc_id: "27506805582236862", query: intern}
    status: from_fit
    notes: Scrape the LSD token from metacareers.com/jobsearch first; send Sec-Fetch-* headers. doc_id rotates with site deploys and breaks often.

  - name: Apple
    category: faang
    hubs: [London, Munich, Zurich, Cork]
    adapter: custom
    url: https://jobs.apple.com/api/v1/search
    params: {query: internship}
    status: from_fit
    notes: POST. The 'format' body field is required or the API silently returns nothing. 'intern' matches retail codes; use 'internship'.

  - name: Amazon
    category: faang
    hubs: [London, Berlin, Dublin, Luxembourg, Gdansk]
    adapter: custom
    url: https://www.amazon.jobs/en/search.json
    params: {passes: [{base_query: intern}, {"business_category[]": studentprograms}]}
    status: from_fit
    notes: Two passes, dedupe by id_icims. Normalise company name to "Amazon" (the feed carries legal-entity names).

  - name: Microsoft
    category: faang
    hubs: [London, Dublin, Zurich, Prague]
    adapter: eightfold_pcsx
    host: apply.careers.microsoft.com
    domain: microsoft.com
    params: {queries: [intern, internship]}
    status: from_fit
    notes: 10 results per page max. Returns 429 under load; back off.

  - name: Netflix
    category: faang
    hubs: [Amsterdam, London, Madrid]
    adapter: eightfold
    host: explore.jobs.netflix.net
    domain: netflix.com
    status: from_fit

